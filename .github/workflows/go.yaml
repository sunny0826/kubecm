name: Go

on:
  push:
    branches:
      - "master"
    paths:
      - '**.go'
      - '**.yaml'
      - '**.mod'
      - '**.sum'
      - '**.yml'
      - 'mise.toml'
      - 'Makefile'
  pull_request:
    paths:
      - '**.go'
      - '**.yaml'
      - '**.mod'
      - '**.sum'
      - '**.yml'
      - 'mise.toml'
      - 'Makefile'
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: go golangci-lint actionlint shellcheck

      - name: Run test
        run: |
          mise exec -- make test
          mise exec -- go test -race ./pkg/...
          mise exec -- go mod tidy -diff

      - name: golangci-lint
        run: mise exec -- golangci-lint run ./...

      - name: Validate workflows
        run: mise exec -- actionlint

      - name: Upload coverage report
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
